<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>web_search Tool 完整调用动画</title>
  <style>
    :root{--bg:#f8fafc;--ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--blue:#2563eb}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1080px;margin:auto;padding:20px}h1{margin:0 0 6px;font-size:22px}.intro{margin:0 0 15px;color:var(--muted);font-size:14px;line-height:1.6}.lane{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.node{min-height:132px;padding:11px;background:#fff;border:1px solid var(--line);border-radius:10px;opacity:.22;transform:translateX(-10px);transition:.35s}.node.active{opacity:1;transform:none;border-color:var(--blue);box-shadow:0 10px 22px rgba(37,99,235,.18)}.node.done{opacity:1;transform:none;background:#f5f3ff;border-color:#c4b5fd}.num{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--blue);font-weight:800;margin-bottom:8px}.name{font-weight:800;font-size:15px;margin-bottom:7px}.desc{color:#475569;font-size:12px;line-height:1.5}.details{display:grid;grid-template-columns:.85fr 1.15fr;gap:12px;margin-top:13px}.panel{padding:14px;background:#fff;border:1px solid var(--line);border-radius:10px}.title{font-size:18px;font-weight:900;margin-bottom:8px}.text{font-size:14px;color:#334155;line-height:1.7}pre{margin:0;min-height:145px;padding:12px;border-radius:8px;background:#0f172a;color:#dbeafe;white-space:pre-wrap;font-size:12px;line-height:1.5}.controls{display:flex;gap:8px;margin-top:11px}button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}button.primary{background:var(--ink);border-color:var(--ink);color:#fff}@media(max-width:850px){.lane{grid-template-columns:1fr}.node{min-height:auto}.details{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="wrap"><h1>web_search：把开放问题变成可引用资料</h1><p class="intro">搜索工具会构造查询词，调用搜索服务，再把标题、摘要和链接整理成 Observation。</p>
<div class="lane"><div class="node"><div class="num">1</div><div class="name">用户输入</div><div class="desc">帮我搜索成都旅行攻略</div></div><div class="node"><div class="num">2</div><div class="name">构造搜索词</div><div class="desc">成都 旅游攻略 景点 路线</div></div><div class="node"><div class="num">3</div><div class="name">搜索请求</div><div class="desc">POST searchfree.site/api/search</div></div><div class="node"><div class="num">4</div><div class="name">搜索结果</div><div class="desc">标题、摘要、链接逐条返回</div></div><div class="node"><div class="num">5</div><div class="name">Observation</div><div class="desc">截取前 3 条结果并整理文本</div></div><div class="node"><div class="num">6</div><div class="name">LLM 总结</div><div class="desc">根据搜索资料生成旅行建议</div></div></div>
<div class="details"><div class="panel"><div class="title" id="title"></div><div class="text" id="text"></div><div class="controls"><button class="primary" id="play">播放完整流程</button><button id="next">单步前进</button><button id="reset">重播</button></div></div><div class="panel"><pre id="code"></pre></div></div></div>
<script>
const copy=[["等待开始","点击播放，观察一次 web_search 完整过程。","user_input = \"帮我搜索成都旅行攻略\""],["读取开放问题","攻略类问题没有唯一固定 API，适合使用搜索。","query_text = \"成都\""],["构造搜索词","程序补充关键词，让结果更聚焦旅行规划。","query = \"成都 旅游攻略 景点 路线\""],["调用搜索服务","请求搜索接口，限制最多返回 3 条结果。","POST https://searchfree.site/api/search\n{\"query\": query, \"max_results\": 3}"],["读取标题、摘要和链接","程序遍历搜索结果，保留可追溯来源。","1. 标题：成都旅行路线...\n   摘要：...\n   链接：https://..."],["形成 Observation","搜索结果被整理成一段文本。","tool_result = \"web_search 搜索 API...\\n搜索结果：...\""],["交给 LLM 总结","模型基于搜索结果给用户更清晰的建议。","answer = llm.chat(user_input + tool_result)"]];
let step=0,timer=null;const nodes=[...document.querySelectorAll(".node")],title=document.getElementById("title"),text=document.getElementById("text"),code=document.getElementById("code");function render(){nodes.forEach((n,i)=>{n.classList.toggle("done",i<step);n.classList.toggle("active",i===step-1)});title.textContent=copy[step][0];text.textContent=copy[step][1];code.textContent=copy[step][2]}function advance(){if(step<nodes.length){step++;render()}else{clearInterval(timer);timer=null}}document.getElementById("play").onclick=()=>{clearInterval(timer);timer=setInterval(advance,700)};document.getElementById("next").onclick=advance;document.getElementById("reset").onclick=()=>{clearInterval(timer);timer=null;step=0;render()};render();
</script></body></html>
