<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>代码练习系统</title>

  <style>
    body {
      background: #f5f7fb;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 40px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .title {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #222;
    }

    .desc {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.8;
    }

    .editor {
      background: #1e1e1e;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .editor-header {
      height: 44px;
      background: #2b2b2b;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #3a3a3a;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .red {
      background: #ff5f56;
    }

    .yellow {
      background: #ffbd2e;
    }

    .green {
      background: #27c93f;
    }

    .code-area {
      padding: 24px;
      font-family: Consolas, Monaco, monospace;
      font-size: 15px;
      line-height: 1.8;
      color: #d4d4d4;
      white-space: pre;
    }

    .readonly {
      color: #bdbdbd;
    }

    .editable-wrapper {
      margin: 16px 0;
      border: 2px dashed #ffc107;
      border-radius: 10px;
      background: rgba(255, 193, 7, 0.08);
      position: relative;
      padding-top: 24px;
    }

    .editable-title {
      position: absolute;
      top: -12px;
      left: 12px;
      background: #1e1e1e;
      color: #ffc107;
      font-size: 12px;
      font-weight: bold;
      padding: 0 8px;
    }

    .editable {
      width: 100%;
      min-height: 120px;
      background: transparent;
      border: none;
      outline: none;
      resize: vertical;

      color: #ffd666;
      font-size: 15px;
      line-height: 1.8;
      font-family: Consolas, Monaco, monospace;

      padding: 16px;
      box-sizing: border-box;
    }

    .editable::placeholder {
      color: rgba(255,255,255,0.35);
    }

    .footer {
      margin-top: 20px;
      color: #666;
      line-height: 1.8;
      background: white;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .lock {
      color: #888;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">
    Python 编程练习
  </div>

  <div class="desc">
    请在黄色区域中完成代码，其余代码不可修改。
  </div>

  <div class="editor">

    <div class="editor-header">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>

    <div class="code-area">

<span class="readonly"># 🔒 以下代码不可修改

def calculate_average(scores):
    total = sum(scores)
    count = len(scores)</span>

<div class="editable-wrapper">
  <div class="editable-title">
    请实现
  </div>

<textarea class="editable" placeholder="# 在这里输入你的代码
average = total / count
return average"></textarea>
</div>

<span class="readonly">scores = [90, 85, 100, 95]

result = calculate_average(scores)

print("平均分:", result)</span>

    </div>

  </div>

  <div class="footer">
    <strong>要求：</strong><br>
    1. 灰色区域不可修改<br>
    2. 只能在黄色区域输入代码<br>
    3. 请正确返回平均值
  </div>

</div>

</body>
</html>
