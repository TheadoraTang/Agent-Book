<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">状态日志与正式输出分离</title>
  <desc id="desc">展示 Agent 运行时日志进入状态面板，最终回答进入用户回答区域。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#657084"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b36a00"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16885f"/>
    </marker>
    <style>
      .bg{fill:#f6f8fb}.title{font:700 36px Arial,"Microsoft YaHei",sans-serif;fill:#1d2636}
      .sub{font:22px Arial,"Microsoft YaHei",sans-serif;fill:#657084}
      .h{font:700 24px Arial,"Microsoft YaHei",sans-serif}.body{font:20px Arial,"Microsoft YaHei",sans-serif;fill:#1d2636}
      .mono{font:18px Consolas,"Courier New",monospace;fill:#1d2636}.white{font:20px Arial,"Microsoft YaHei",sans-serif;fill:#1d2636}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="50" y="70">状态日志与正式输出分离</text>
  <text class="sub" x="52" y="112">前端通过通道或类型识别：日志用于展示过程，stdout 用于展示结果。</text>

  <rect x="70" y="170" width="350" height="400" rx="10" fill="#ffffff" stroke="#d9e0ea" stroke-width="3"/>
  <text class="h" x="98" y="218" fill="#1d2636">Agent Runtime</text>
  <text class="mono" x="100" y="270">[INFO] Think: 需要天气</text>
  <text class="mono" x="100" y="305">[INFO] Act: get_weather</text>
  <text class="mono" x="100" y="340">[INFO] Observe: 小雨</text>
  <text class="mono" x="100" y="405">最终回答文本</text>

  <rect x="500" y="170" width="200" height="400" rx="10" fill="#eef4ff" stroke="#2864d8" stroke-width="3"/>
  <text class="h" x="562" y="220" fill="#2864d8">Router</text>
  <text class="body" x="548" y="330">识别事件类型</text>
  <text class="body" x="558" y="365">或输出通道</text>

  <rect x="780" y="160" width="350" height="180" rx="10" fill="#fff6e5" stroke="#b36a00" stroke-width="3"/>
  <text class="h" x="810" y="210" fill="#b36a00">stderr / logging</text>
  <text class="body" x="815" y="255">前端状态面板</text>
  <text class="body" x="815" y="290">Think / Act / Observe / Tool Call</text>

  <rect x="780" y="400" width="350" height="180" rx="10" fill="#f0fbf6" stroke="#16885f" stroke-width="3"/>
  <text class="h" x="810" y="450" fill="#16885f">stdout / answer</text>
  <text class="body" x="815" y="500">用户回答区域</text>
  <text class="body" x="815" y="535">只显示最终结果</text>

  <line x1="420" y1="365" x2="500" y2="365" stroke="#657084" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M700 290 C730 270 750 260 780 250" fill="none" stroke="#b36a00" stroke-width="4" marker-end="url(#arrow-amber)"/>
  <path d="M700 450 C730 470 750 482 780 490" fill="none" stroke="#16885f" stroke-width="4" marker-end="url(#arrow-green)"/>
</svg>
