<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">API call overview</title>
  <desc id="desc">A diagram showing a user, an Agent program, an API gateway, an LLM service, and a response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="1120" height="540" rx="28" fill="#f8fafc" />
  <text x="560" y="56" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#0f172a">程序调用 LLM：一次请求，一次生成，一次返回</text>
  <text x="560" y="90" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">后续所有 Agent 能力，都建立在这条基础链路上</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="60" y="190" width="170" height="120" rx="20" fill="#dbeafe" stroke="#93c5fd" filter="url(#shadow)" />
    <text x="145" y="238" text-anchor="middle" font-size="23" font-weight="700" fill="#1e3a8a">用户</text>
    <text x="145" y="270" text-anchor="middle" font-size="15" fill="#475569">提出旅行问题</text>

    <rect x="320" y="170" width="210" height="160" rx="22" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)" />
    <text x="425" y="214" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Agent 程序</text>
    <text x="425" y="246" text-anchor="middle" font-size="15" fill="#475569">组织 messages</text>
    <text x="425" y="272" text-anchor="middle" font-size="15" fill="#475569">携带配置参数</text>
    <text x="425" y="298" text-anchor="middle" font-size="15" fill="#475569">处理返回结果</text>

    <rect x="620" y="170" width="210" height="160" rx="22" fill="#ecfeff" stroke="#67e8f9" filter="url(#shadow)" />
    <text x="725" y="214" text-anchor="middle" font-size="23" font-weight="700" fill="#155e75">API 服务</text>
    <text x="725" y="246" text-anchor="middle" font-size="15" fill="#475569">检查 api_key</text>
    <text x="725" y="272" text-anchor="middle" font-size="15" fill="#475569">读取 model_name</text>
    <text x="725" y="298" text-anchor="middle" font-size="15" fill="#475569">转交模型生成</text>

    <rect x="920" y="190" width="150" height="120" rx="20" fill="#dcfce7" stroke="#86efac" filter="url(#shadow)" />
    <text x="995" y="238" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">LLM</text>
    <text x="995" y="270" text-anchor="middle" font-size="15" fill="#475569">生成回答</text>
  </g>

  <g stroke="#0f172a" stroke-width="2.8" fill="none" marker-end="url(#arrow)">
    <path d="M232 250 L316 250" />
    <path d="M532 250 L616 250" />
    <path d="M832 250 L916 250" />
    <path d="M994 314 C970 420, 206 420, 152 314" />
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#475569">
    <text x="274" y="232" text-anchor="middle">输入</text>
    <text x="576" y="232" text-anchor="middle">请求</text>
    <text x="876" y="232" text-anchor="middle">生成</text>
    <text x="560" y="456" text-anchor="middle">回复返回给程序，再展示给用户或进入下一步 Agent 流程</text>
  </g>
</svg>

