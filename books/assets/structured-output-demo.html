<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>从自然语言到结构化输出</title>
  <style>
    :root {
      --bg: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #dbe3ee;
      --blue: #2563eb;
      --teal: #14b8a6;
      --orange: #f97316;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 0;
    }
    .intro {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 70px 1fr;
      gap: 12px;
      align-items: stretch;
    }
    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      min-height: 300px;
    }
    .head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-weight: 900;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .tag {
      font-size: 12px;
      color: #fff;
      background: var(--orange);
      border-radius: 8px;
      padding: 4px 8px;
    }
    .structured .tag { background: var(--teal); }
    .content {
      padding: 16px;
      color: #334155;
      line-height: 1.8;
      font-size: 14px;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      color: #dbeafe;
      background: #0f172a;
      border-radius: 10px;
      padding: 14px;
      line-height: 1.55;
      font-size: 13px;
      min-height: 230px;
    }
    .arrow {
      display: grid;
      place-items: center;
    }
    .circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.16);
      animation: pulse 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .note {
      margin-top: 12px;
      color: #475569;
      line-height: 1.6;
      font-size: 14px;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .arrow { min-height: 58px; }
      .circle { transform: rotate(90deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>结构化输出：让程序也能读懂模型回答</h1>
    <p class="intro">自然语言适合人读，JSON 这类结构化输出更适合程序继续保存、渲染、检查和修改。</p>
    <div class="grid">
      <div class="panel">
        <div class="head">自然语言回答 <span class="tag">给人读</span></div>
        <div class="content" id="plain">第一天上午可以去西湖沿湖散步，下午去灵隐寺，晚上到河坊街吃小吃。第二天可以安排良渚博物院，下午找一家咖啡馆休息，整体节奏轻松一点。</div>
      </div>
      <div class="arrow"><div class="circle">→</div></div>
      <div class="panel structured">
        <div class="head">结构化输出 <span class="tag">给程序用</span></div>
        <div class="content"><pre id="json"></pre></div>
      </div>
    </div>
    <div class="controls">
      <button class="primary" id="toggle">切换示例</button>
    </div>
    <div class="note" id="note">程序可以读取 days 数组，逐天渲染卡片，也可以检查每天 schedule 的数量是否过多。</div>
  </div>
  <script>
    const examples = [
      {
        plain: "第一天上午可以去西湖沿湖散步，下午去灵隐寺，晚上到河坊街吃小吃。第二天可以安排良渚博物院，下午找一家咖啡馆休息，整体节奏轻松一点。",
        json: {
          destination: "杭州",
          duration_days: 2,
          style: "轻松",
          days: [
            {
              day: 1,
              schedule: [
                { time: "上午", place: "西湖", activity: "沿湖散步" },
                { time: "下午", place: "灵隐寺", activity: "参观寺院" },
                { time: "晚上", place: "河坊街", activity: "吃小吃" }
              ]
            },
            {
              day: 2,
              schedule: [
                { time: "上午", place: "良渚博物院", activity: "参观展览" },
                { time: "下午", place: "咖啡馆", activity: "休息调整" }
              ]
            }
          ]
        },
        note: "程序可以读取 days 数组，逐天渲染卡片，也可以检查每天 schedule 的数量是否过多。"
      },
      {
        plain: "用户想去成都三天，但没有给出出行日期和具体预算。现在可以先追问这两个信息，不要直接编造天气或票价。",
        json: {
          destination: "成都",
          duration_days: 3,
          can_plan_now: false,
          missing_info: ["出行日期", "具体预算"],
          next_question: "你计划哪几天出发？大概预算是多少？"
        },
        note: "结构化输出不只用于行程，也可以表达“信息是否足够”和“下一步要追问什么”。"
      }
    ];
    let index = 0;
    const plain = document.getElementById("plain");
    const json = document.getElementById("json");
    const note = document.getElementById("note");
    function render() {
      plain.textContent = examples[index].plain;
      json.textContent = JSON.stringify(examples[index].json, null, 2);
      note.textContent = examples[index].note;
    }
    document.getElementById("toggle").addEventListener("click", () => {
      index = (index + 1) % examples.length;
      render();
    });
    render();
  </script>
</body>
</html>
