<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attention 关注关系演示</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --teal: #14b8a6;
      --orange: #f97316;
      --line: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    button.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .board {
      position: relative;
      background: var(--panel);
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      min-height: 280px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }
    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .tokens {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(7, minmax(72px, 1fr));
      gap: 12px;
      padding: 112px 24px 32px;
    }
    .token {
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 10px;
      min-height: 58px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
    }
    .token.focus {
      transform: translateY(-8px);
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      border-color: transparent;
    }
    .token.hot {
      border-color: var(--orange);
      background: #fff7ed;
    }
    .caption {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    .note {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      color: #334155;
    }
    .note strong { color: var(--ink); }
    @media (max-width: 720px) {
      .top, .caption { grid-template-columns: 1fr; display: grid; }
      .controls { justify-content: flex-start; }
      .tokens { grid-template-columns: repeat(4, minmax(64px, 1fr)); padding-top: 88px; }
      .token { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Attention：当前词会关注谁？</h1>
        <p>点击一个词，观察它在理解句子时更可能关注哪些上下文片段。线越粗，表示教学演示中的关注越强。</p>
      </div>
      <div class="controls" aria-label="选择当前关注词">
        <button class="active" data-focus="它">它</button>
        <button data-focus="护照">护照</button>
        <button data-focus="明天">明天</button>
      </div>
    </div>

    <div class="board">
      <svg viewBox="0 0 980 280" preserveAspectRatio="none" aria-hidden="true">
        <g id="lines"></g>
      </svg>
      <div class="tokens" id="tokens">
        <div class="token" data-token="小明">小明</div>
        <div class="token" data-token="把">把</div>
        <div class="token" data-token="护照">护照</div>
        <div class="token" data-token="放进">放进</div>
        <div class="token" data-token="背包">背包</div>
        <div class="token" data-token="因为">因为</div>
        <div class="token" data-token="它">它</div>
        <div class="token" data-token="明天">明天</div>
        <div class="token" data-token="出国">出国</div>
        <div class="token" data-token="要用">要用</div>
      </div>
    </div>

    <div class="caption">
      <div class="note"><strong>直觉理解：</strong>模型处理“它”时，会更关注“护照”“出国”“要用”等信息，从而判断这里的“它”更可能指护照。</div>
      <div class="note"><strong>开发意义：</strong>Prompt、历史对话和工具结果都会进入上下文。Agent 设计得越清楚，模型越容易关注到真正重要的信息。</div>
    </div>
  </div>

  <script>
    const presets = {
      "它": [["它", "护照", 7], ["它", "出国", 5], ["它", "要用", 5], ["它", "背包", 2]],
      "护照": [["护照", "小明", 4], ["护照", "放进", 5], ["护照", "背包", 4], ["护照", "它", 7]],
      "明天": [["明天", "出国", 7], ["明天", "要用", 4], ["明天", "它", 3]]
    };

    const tokens = [...document.querySelectorAll(".token")];
    const buttons = [...document.querySelectorAll("button[data-focus]")];
    const lines = document.getElementById("lines");

    function centerFor(tokenEl) {
      const board = document.querySelector(".board").getBoundingClientRect();
      const box = tokenEl.getBoundingClientRect();
      return {
        x: ((box.left + box.width / 2) - board.left) / board.width * 980,
        y: ((box.top + box.height / 2) - board.top) / board.height * 280
      };
    }

    function draw(focus) {
      lines.innerHTML = "";
      tokens.forEach(el => {
        el.classList.toggle("focus", el.dataset.token === focus);
        el.classList.remove("hot");
      });
      for (const [from, to, weight] of presets[focus]) {
        const a = tokens.find(el => el.dataset.token === from);
        const b = tokens.find(el => el.dataset.token === to);
        if (!a || !b) continue;
        b.classList.add("hot");
        const p1 = centerFor(a);
        const p2 = centerFor(b);
        const midY = Math.min(p1.y, p2.y) - 58 - weight * 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${p1.x} ${p1.y - 20} C ${p1.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y - 20}`);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", weight > 5 ? "#f97316" : "#2563eb");
        path.setAttribute("stroke-width", String(weight));
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("opacity", weight > 5 ? "0.85" : "0.45");
        lines.appendChild(path);
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        draw(btn.dataset.focus);
      });
    });

    window.addEventListener("resize", () => {
      const active = document.querySelector("button.active").dataset.focus;
      draw(active);
    });

    draw("它");
  </script>
</body>
</html>
