<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>天气 API Tool 完整调用动画</title>
  <style>
    :root{--bg:#f8fafc;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--blue:#2563eb;--teal:#0f766e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1080px;margin:auto;padding:20px}h1{margin:0 0 6px;font-size:22px}.intro{margin:0 0 15px;color:var(--muted);font-size:14px;line-height:1.6}
    .lane{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.node{min-height:130px;padding:11px;background:#fff;border:1px solid var(--line);border-radius:10px;opacity:.25;transform:scale(.96);transition:.35s}.node.active{opacity:1;transform:scale(1.04);border-color:var(--blue);box-shadow:0 10px 22px rgba(37,99,235,.18)}.node.done{opacity:1;transform:none;background:#ecfeff;border-color:#a5f3fc}
    .num{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--blue);font-weight:800;margin-bottom:8px}.name{font-weight:800;font-size:15px;margin-bottom:7px}.desc{color:#475569;font-size:12px;line-height:1.5}.details{display:grid;grid-template-columns:.85fr 1.15fr;gap:12px;margin-top:13px}.panel{padding:14px;background:#fff;border:1px solid var(--line);border-radius:10px}.title{font-size:18px;font-weight:900;margin-bottom:8px}.text{font-size:14px;color:#334155;line-height:1.7}pre{margin:0;min-height:145px;padding:12px;border-radius:8px;background:#0f172a;color:#dbeafe;white-space:pre-wrap;font-size:12px;line-height:1.5}.controls{display:flex;gap:8px;margin-top:11px}button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}button.primary{background:var(--ink);border-color:var(--ink);color:#fff}@media(max-width:850px){.lane{grid-template-columns:1fr}.node{min-height:auto}.details{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="wrap"><h1>weather_api：经过 HTTP 请求获取实时天气</h1><p class="intro">这条链路会明显经过外部 API：城市参数先转成经纬度，再发出请求，最后解析 JSON 返回值。</p>
<div class="lane"><div class="node"><div class="num">1</div><div class="name">用户输入</div><div class="desc">上海现在天气怎么样？</div></div><div class="node"><div class="num">2</div><div class="name">城市坐标</div><div class="desc">上海 → 31.2304, 121.4737</div></div><div class="node"><div class="num">3</div><div class="name">HTTP 请求</div><div class="desc">请求 Open-Meteo forecast API</div></div><div class="node"><div class="num">4</div><div class="name">JSON 响应</div><div class="desc">读取温度、湿度、降水和天气代码</div></div><div class="node"><div class="num">5</div><div class="name">Observation</div><div class="desc">整理成人类可读天气文本</div></div><div class="node"><div class="num">6</div><div class="name">旅行建议</div><div class="desc">LLM 根据实时天气调整行程</div></div></div>
<div class="details"><div class="panel"><div class="title" id="title"></div><div class="text" id="text"></div><div class="controls"><button class="primary" id="play">播放完整流程</button><button id="next">单步前进</button><button id="reset">重播</button></div></div><div class="panel"><pre id="code"></pre></div></div></div>
<script>
const copy=[["等待开始","点击播放，观察一次外部 API 调用。","user_input = \"上海现在天气怎么样？\""],["读取用户问题","Agent 识别出用户需要实时天气。","city = \"上海\""],["查找经纬度","天气 API 需要坐标而不是城市中文名。","coordinates = CITY_COORDINATES[\"上海\"]\n# 31.2304, 121.4737"],["发送 HTTP 请求","程序调用 Open-Meteo。","GET https://api.open-meteo.com/v1/forecast?..."],["解析 JSON 响应","程序提取温度、湿度、降水和天气代码。","data = json.loads(response.read())\ncurrent = data[\"current\"]"],["形成 Observation","结构化数据被整理成模型容易阅读的文本。","tool_result = \"上海当前多云，气温 24 摄氏度...\""],["生成旅行建议","LLM 结合实时天气回答步行和穿衣问题。","answer = llm.chat(user_input + tool_result)"]];
let step=0,timer=null;const nodes=[...document.querySelectorAll(".node")],title=document.getElementById("title"),text=document.getElementById("text"),code=document.getElementById("code");function render(){nodes.forEach((n,i)=>{n.classList.toggle("done",i<step);n.classList.toggle("active",i===step-1)});title.textContent=copy[step][0];text.textContent=copy[step][1];code.textContent=copy[step][2]}function advance(){if(step<nodes.length){step++;render()}else{clearInterval(timer);timer=null}}document.getElementById("play").onclick=()=>{clearInterval(timer);timer=setInterval(advance,700)};document.getElementById("next").onclick=advance;document.getElementById("reset").onclick=()=>{clearInterval(timer);timer=null;step=0;render()};render();
</script></body></html>
