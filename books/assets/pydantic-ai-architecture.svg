<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">TravelPlanAgent v0.9 Pydantic AI Think Act Observe Multi-Agent architecture</title>
  <desc id="desc">A diagram showing a Pydantic AI based TravelPlanAgent with planner agent, multiple sub agents, observer agent, final agent, tools, dependencies, and structured output.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .think { fill: #ecfeff; stroke: #0891b2; }
      .act { fill: #f0fdf4; stroke: #16a34a; }
      .observe { fill: #fff7ed; stroke: #ea580c; }
      .final { fill: #fef2f2; stroke: #dc2626; }
      .deps { fill: #f8fafc; stroke: #64748b; }
      .text { fill: #0f172a; font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 18px; }
      .small { fill: #334155; font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 13px; }
      .tiny { fill: #475569; font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; }
      .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="620" rx="18" />
  <text class="text" x="340" y="34">TravelPlanAgent v0.9：Pydantic AI 版 Think-Act-Observe + Multi-Agent</text>

  <rect class="box" x="40" y="78" width="165" height="86" rx="8" />
  <text class="text" x="82" y="112">用户输入</text>
  <text class="small" x="60" y="140">成都三日游，不要太累</text>

  <rect class="box think" x="280" y="70" width="210" height="104" rx="8" />
  <text class="text" x="319" y="108">PlannerAgent</text>
  <text class="small" x="306" y="136">Think：输出 PlanOutput</text>
  <text class="tiny" x="308" y="157">结构化子任务列表</text>

  <rect class="box act" x="95" y="260" width="840" height="170" rx="8" />
  <text class="text" x="425" y="292">Act：多个 Pydantic AI 副 Agent</text>
  <rect class="box" x="125" y="318" width="145" height="78" rx="8" />
  <text class="small" x="153" y="348">LocalTipsAgent</text>
  <text class="tiny" x="153" y="372">本地提醒</text>
  <rect class="box" x="290" y="318" width="145" height="78" rx="8" />
  <text class="small" x="325" y="348">WeatherAgent</text>
  <text class="tiny" x="325" y="372">天气 API</text>
  <rect class="box" x="455" y="318" width="145" height="78" rx="8" />
  <text class="small" x="499" y="348">RAGAgent</text>
  <text class="tiny" x="487" y="372">知识库检索</text>
  <rect class="box" x="620" y="318" width="145" height="78" rx="8" />
  <text class="small" x="653" y="348">WebSearchAgent</text>
  <text class="tiny" x="656" y="372">网页搜索</text>
  <rect class="box" x="785" y="318" width="125" height="78" rx="8" />
  <text class="small" x="811" y="348">ItineraryAgent</text>
  <text class="tiny" x="819" y="372">行程草案</text>

  <rect class="box deps" x="96" y="470" width="270" height="96" rx="8" />
  <text class="text" x="173" y="505">TravelDeps</text>
  <text class="small" x="126" y="532">城市坐标 / 本地提醒 / 检索器 / 搜索 API</text>

  <rect class="box observe" x="440" y="470" width="210" height="96" rx="8" />
  <text class="text" x="486" y="505">ObserverAgent</text>
  <text class="small" x="474" y="532">Observe：判断是否补充调用</text>

  <rect class="box final" x="735" y="470" width="235" height="96" rx="8" />
  <text class="text" x="797" y="505">FinalAgent</text>
  <text class="small" x="774" y="532">输出 TravelPlanOutput</text>

  <path class="arrow" d="M205 121 H280" />
  <path class="arrow" d="M385 174 C385 214 390 238 455 260" />
  <path class="arrow" d="M515 430 V470" />
  <path class="arrow" d="M650 518 H735" />
  <path class="arrow dash" d="M650 492 C715 425 786 420 845 396" />
  <path class="arrow dash" d="M367 518 C420 450 455 432 515 430" />
  <path class="arrow dash" d="M231 470 C230 430 230 420 230 396" />
  <path class="arrow dash" d="M231 470 C365 438 528 429 692 396" />

  <text class="tiny" x="226" y="108">用户目标</text>
  <text class="tiny" x="404" y="230">PlanOutput 子任务</text>
  <text class="tiny" x="528" y="454">SubAgentOutput observations</text>
  <text class="tiny" x="675" y="505">信息足够</text>
  <text class="tiny" x="728" y="443">Act Again</text>
  <text class="tiny" x="255" y="456">RunContext 读取依赖</text>
</svg>
