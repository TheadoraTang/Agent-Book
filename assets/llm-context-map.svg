<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">LLM context map</title>
  <desc id="desc">A diagram showing how user input, system rules, history, tools, and documents become context for an LLM response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="1100" height="560" rx="28" fill="#f8fafc" />
  <text x="550" y="54" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#0f172a">LLM 不是凭空回答，而是在上下文里继续生成</text>
  <text x="550" y="88" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">Agent 开发的关键，是决定模型这一次能看到什么</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">
    <rect x="70" y="130" width="210" height="72" rx="16" fill="#dbeafe" stroke="#93c5fd" />
    <text x="175" y="160" text-anchor="middle" font-weight="700">用户输入</text>
    <text x="175" y="184" text-anchor="middle" font-size="14" fill="#475569">我要去成都玩三天</text>

    <rect x="70" y="242" width="210" height="72" rx="16" fill="#dcfce7" stroke="#86efac" />
    <text x="175" y="272" text-anchor="middle" font-weight="700">系统规则</text>
    <text x="175" y="296" text-anchor="middle" font-size="14" fill="#475569">你是旅行规划助手</text>

    <rect x="70" y="354" width="210" height="72" rx="16" fill="#ffedd5" stroke="#fdba74" />
    <text x="175" y="384" text-anchor="middle" font-weight="700">历史对话</text>
    <text x="175" y="408" text-anchor="middle" font-size="14" fill="#475569">预算低，喜欢小吃</text>

    <rect x="820" y="186" width="210" height="72" rx="16" fill="#fef9c3" stroke="#fde047" />
    <text x="925" y="216" text-anchor="middle" font-weight="700">工具结果</text>
    <text x="925" y="240" text-anchor="middle" font-size="14" fill="#475569">天气、交通、搜索</text>

    <rect x="820" y="318" width="210" height="72" rx="16" fill="#f3e8ff" stroke="#d8b4fe" />
    <text x="925" y="348" text-anchor="middle" font-weight="700">参考资料</text>
    <text x="925" y="372" text-anchor="middle" font-size="14" fill="#475569">知识库、文档、笔记</text>
  </g>

  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M282 166 C350 166, 362 218, 422 236" />
    <path d="M282 278 C350 278, 362 266, 422 260" />
    <path d="M282 390 C350 390, 362 304, 422 284" />
    <path d="M818 222 C748 222, 734 232, 678 244" />
    <path d="M818 354 C748 354, 734 304, 678 282" />
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="170" width="280" height="180" rx="28" fill="url(#core)" />
    <text x="550" y="238" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#ffffff">LLM</text>
    <text x="550" y="276" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#e0f2fe">读取上下文</text>
    <text x="550" y="306" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#e0f2fe">生成下一段内容</text>
  </g>

  <path d="M550 350 C550 402, 550 418, 550 454" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <rect x="390" y="452" width="320" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)" />
  <text x="550" y="483" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">模型回复</text>
  <text x="550" y="508" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#475569">一份成都三天轻松旅行建议</text>
</svg>

